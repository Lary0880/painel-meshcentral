<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Acesso Restrito — Painel de Controle</title>
  <style>
    :root {
      --blue-900: #092052;
      --blue-800: #0d3b8c;
      --blue-600: #0284c7;
      --blue-500: #2563eb;
      --blue-100: #e0f2fe;
      --bg-light: #f0f6ff;
      --text-dark: #0f172a;
      --muted: #475569;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #071638 0%, #0d3b8c 55%, #0284c7 100%);
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .top-bar {
      height: 5px;
      width: 100%;
      background: linear-gradient(90deg, #38bdf8, #2563eb, #10b981);
    }
    .auth-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .auth-card {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }
    .auth-header {
      background: linear-gradient(135deg, #092052 0%, #0d3b8c 60%, #0284c7 100%);
      color: #ffffff;
      padding: 30px 28px 24px;
      text-align: center;
      border-bottom: 3px solid #38bdf8;
    }
    .auth-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.35);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      margin-bottom: 12px;
    }
    .auth-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.2);
      border: 1px solid rgba(56, 189, 248, 0.45);
      color: #e0f2fe;
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 8px;
    }
    .auth-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: #ffffff;
    }
    .auth-subtitle {
      font-size: 0.84rem;
      color: #bae6fd;
      margin-top: 4px;
    }
    .auth-body {
      padding: 28px;
    }
    .error-box {
      display: none;
      align-items: center;
      gap: 10px;
      background: var(--danger-bg);
      border: 1px solid #fca5a5;
      color: var(--danger);
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.84rem;
      font-weight: 600;
      margin-bottom: 18px;
    }
    .field-group {
      margin-bottom: 18px;
    }
    .field-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .auth-input {
      width: 100%;
      padding: 12px 14px;
      font-size: 0.95rem;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      background: #f8fafc;
      color: var(--text-dark);
      outline: none;
      transition: all 0.2s;
    }
    .auth-input:focus {
      border-color: var(--blue-500);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    .toggle-pass {
      position: absolute;
      right: 10px;
      background: #e0f2fe;
      color: #0369a1;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }
    .auth-btn {
      width: 100%;
      padding: 13px 18px;
      background: linear-gradient(135deg, #0d3b8c 0%, #0284c7 100%);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 18px rgba(2, 132, 199, 0.3);
      transition: transform 0.15s, opacity 0.15s;
    }
    .auth-btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .auth-footer {
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
      padding: 14px 24px;
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 600;
    }
    .page-footer {
      text-align: center;
      padding: 16px;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.75);
    }
  </style>
</head>
<body>
  <div class="top-bar"></div>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon">🌐</div>
        <h1 class="auth-title">Painel de Controle</h1>
        <p class="auth-subtitle">Acesso exclusivo para usuários autorizados</p>
      </div>

      <form id="loginForm" class="auth-body">
        <div id="errorBox" class="error-box">
          <span>⚠️</span>
          <span id="errorText">Usuário ou senha incorretos.</span>
        </div>

        <div class="field-group">
          <label class="field-label" for="usernameInput">Usuário</label>
          <div class="input-wrap">
            <input
              id="usernameInput"
              class="auth-input"
              type="text"
              name="username"
              placeholder="Digite seu usuário"
              autocomplete="username"
              required
              autofocus
            />
          </div>
        </div>

        <div class="field-group">
          <label class="field-label" for="passwordInput">Senha</label>
          <div class="input-wrap">
            <input
              id="passwordInput"
              class="auth-input"
              type="password"
              name="password"
              placeholder="Digite sua senha"
              autocomplete="current-password"
              style="padding-right: 78px;"
              required
            />
            <button type="button" id="togglePassBtn" class="toggle-pass">Mostrar</button>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="auth-btn">
          <span>Entrar no Painel</span>
          <span>➔</span>
        </button>
      </form>

      <div class="auth-footer">
        Acesso Restrito · Equipe Autorizada
      </div>
    </div>
  </div>

  <div class="page-footer">
    © 2026
  </div>

    function b64ToBytes(b64) {
      const bin = atob(b64);
      const len = bin.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = bin.charCodeAt(i);
      }
      return bytes;
    }

    async function sha256Hex(str) {
      const buf = new TextEncoder().encode(str);
      const hashBuf = await crypto.subtle.digest('SHA-256', buf);
      return Array.from(new Uint8Array(hashBuf))
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
    }

    async function gunzipBytes(compressedBytes) {
      const ds = new DecompressionStream('gzip');
      const writer = ds.writable.getWriter();
      writer.write(compressedBytes);
      writer.close();
      const response = new Response(ds.readable);
      const ab = await response.arrayBuffer();
      return new TextDecoder('utf-8').decode(ab);
    }

    async function decryptPayloadWithMasterKey(masterKeyB64, userMeta) {
      const rawMasterKey = b64ToBytes(masterKeyB64);
      const payloadIv = b64ToBytes(VAULT.piv);
      const payloadCt = b64ToBytes(VAULT.pct);

      const cryptoMasterKey = await crypto.subtle.importKey(
        'raw',
        rawMasterKey,
        { name: 'AES-GCM' },
        false,
        ['decrypt']
      );

      const compressedAb = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: payloadIv },
        cryptoMasterKey,
        payloadCt
      );

      const decryptedHtml = await gunzipBytes(new Uint8Array(compressedAb));

      window.__MESH_ACTIVE_USER__ = userMeta;
      sessionStorage.setItem('mesh_dash_session_v1', JSON.stringify(userMeta));

      document.open();
      document.write(decryptedHtml);
      document.close();
    }

    (async function checkSavedSession() {
      try {
        const saved = sessionStorage.getItem('mesh_dash_session_v1');
        if (!saved) return;
        const parsed = JSON.parse(saved);
        if (parsed && parsed.masterKeyB64) {
          await decryptPayloadWithMasterKey(parsed.masterKeyB64, parsed);
        }
      } catch (e) {
        sessionStorage.removeItem('mesh_dash_session_v1');
      }
    })();

    document.getElementById('togglePassBtn').addEventListener('click', function() {
      const passInput = document.getElementById('passwordInput');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        this.textContent = 'Ocultar';
      } else {
        passInput.type = 'password';
        this.textContent = 'Mostrar';
      }
    });

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const errBox = document.getElementById('errorBox');
      const errText = document.getElementById('errorText');
      const submitBtn = document.getElementById('submitBtn');

      errBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Verificando credenciais...</span>';

      try {
        const normUser = document.getElementById('usernameInput').value.trim().toLowerCase();
        const password = document.getElementById('passwordInput').value;

        const userHash = await sha256Hex('mesh-auth-user:' + normUser);
        const envelope = VAULT.users[userHash];

        if (!envelope) {
          throw new Error('INVALID_CREDENTIALS');
        }

        const salt = b64ToBytes(envelope.s);
        const wrapIv = b64ToBytes(envelope.iv);
        const wrapCt = b64ToBytes(envelope.ct);

        const baseKey = await crypto.subtle.importKey(
          'raw',
          new TextEncoder().encode(normUser + ':' + password),
          'PBKDF2',
          false,
          ['deriveKey']
        );

        const wrappingKey = await crypto.subtle.deriveKey(
          {
            name: 'PBKDF2',
            salt: salt,
            iterations: envelope.it,
            hash: 'SHA-256'
          },
          baseKey,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );

        const unwrappedAb = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: wrapIv },
          wrappingKey,
          wrapCt
        );

        const userSecret = JSON.parse(new TextDecoder('utf-8').decode(unwrappedAb));
        submitBtn.innerHTML = '<span>Desbloqueando painel...</span>';

        await decryptPayloadWithMasterKey(userSecret.masterKeyB64, userSecret);
      } catch (err) {
        errText.textContent = 'Usuário ou senha incorretos. Verifique seus dados e tente novamente.';
        errBox.style.display = 'flex';
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Entrar no Painel</span><span>➔</span>';
      }
    });
  </script>
